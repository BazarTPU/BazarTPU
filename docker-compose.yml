version: '3.8'

services:
  web:
    build: .
    command: >
      sh -c "echo 'Waiting for database...' &&
             sleep 15 &&
             echo 'Running migrations...' &&
             python bazar/manage.py migrate &&
             echo 'Starting server...' &&
             python bazar/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_SETTINGS_MODULE=bazar.settings
      - DATABASE_URL=mysql://root:password@db:3306/bazar
      - MYSQL_DATABASE=bazar
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_HOST=db
    restart: unless-stopped

  db:
    image: mysql:8.0
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=bazar
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data: 