<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новое объявление</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/newProduct.css">
</head>
<body>
    <header class=" text-bg-white ">
        <div class="container headerMain " >
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start ">
            
    
            <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none ">
                <img src="../image/tpuLogo.png" alt="LOGO" width="70px">
                <span class="mainName">Базар</span>
            </a>
    
            <form class="col-12 col-lg-3 mb-3 mb-lg-0 me-lg-3 inputMainLocation" role="search">
              <input type="search" class=" inputMain " placeholder="Поиск" ><!-- form-control-->
              <!-- <img src="image/Lupa.webp" alt="" class="lupa" height="35px"> -->
            </form>
            
            <!-- <img src="image/Lupa.webp" alt="" class="lupa" height="35px"> -->
            <div class="text-end ">
              <button class="buttonHeader">Разместить объявление</button>
              <button class="buttonHeader">Профиль</button>
            </div>
          </div>
        </div>
    </header>
    <main class=" ">
        <div class="container">
            <main>
              <div class="row g-5">
                <div class="col-md-12 col-lg-10">
                  <h2 class="mb-3">Новое объявление</h2>
                  <form class="needs-validation" novalidate="">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <!-- <label for="country" class="form-label">Country</label> -->
                            <select class="form-select" id="country" required="">
                                <option value="">Категория</option>
                                <option>Категория-1</option>
                                <option>Категория-2</option>
                                <option>Категория-3</option>
                                <option>Категория-4</option>
                                <option>Категория-5</option>
                                <option>Категория-6</option>
                            </select>
                            <!-- <div class="invalid-feedback">
                                Please select a valid country.
                            </div> -->
                        </div>
                        <div class="col-12">
                            <h5 class="mb-3" style="font-weight: bold;">Название объявления</h5>
                            <input class="form-control">
                        </div>
                        <div class=" ">
                            <h4>Фотографии</h4>
                            <p>Не более 5</p>
                            <button class=" col-3 buttonAddFoto"><img src="../image/imageAddFoto.jpg" alt="" width = "20%"></button>
                        </div>
                        <div class="col-12">
                            <h4>Описание объявления</h4>
                            <textarea name="" id="" cols="100%" rows="10%" class="form-control textareaNewProduct" style="outline : none"></textarea>
                        </div>
                        <div class="col-12">
                            <h5 class="mb-3" style="font-weight: bold">Цена</h5>
                            <input class="form-control">
                        </div>
                        <div class="col-12">
                            <h5 class="mb-3" style="font-weight: bold; ">Местоположение</h5>
                        </div>
                        <div class="col-md-5 marginOff" >
                            <select class="form-select" id="state" required="">
                            <option value="">Выберите номер общежития</option>
                            <option>Общежитие №1</option>
                            <option>Общежитие №2</option>
                            <option>Общежитие №3</option>
                            <option>Общежитие №4</option>
                            <option>Общежитие №5</option>
                            </select>
                        </div>
                        <div class="col-md-2 or marginOff" style="margin: 5px 0px">
                            <span class="fontOr">или</span>
                        </div>
                        <div class="col-md-5 marginOff" >
                            <input type="text" class="form-control" id="zip" placeholder="Введите адрес" required="">
                        </div>
                        <div class="col-md-12 col-lg-6 divPublish">
                            <button class="w-100 mb-4 buttonNewProduct " type="submit" >Опубликовать</button>
                        </div>
                    </div>
                    <!-- <div class="col-md-12 col-lg-6 divPublish">
                        <button class="w-100 mb-4 buttonNewProduct " type="submit" >Опубликовать</button>
                    </div> -->
                    
                  </form>
                </div>
              </div>
            </main>
          </div>
        </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
