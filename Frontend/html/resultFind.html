<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <script>
      window.onload = () => {
        function cloneCard(idParent, idCard, count) {
          let allProduct = document.getElementById(idParent);
          let oneProduct = document.getElementById(idCard);
          for(let i = 1; i < count; i++){
            let clone = oneProduct.cloneNode(true);
            clone.removeAttribute('id');
            allProduct.appendChild(clone);
          }
        }
        cloneCard('allProduct','oneProduct',20);
      };
    </script>
</head>
<body>
    <header class=" text-bg-white ">
        <div class="container headerMain " >
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start ">
            
    
            <a href="indexB.html" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none ">
                <img src="../image/tpuLogo.png" alt="LOGO" width="70px">
                <span class="mainName">Базар</span>
            </a>
    
            <form class="col-12 col-lg-3 mb-3 mb-lg-0 me-lg-3 inputMainLocation" role="search">
              <input type="search" class=" inputMain " placeholder="Поиск" >
              <a href="resultFind.html" class="inputMainLupa"><img src="../image/Lupa.webp" alt="" style="width: 80%;"></a>
            </form>
            
            <!-- <img src="image/Lupa.webp" alt="" class="lupa" height="35px"> -->
            <div class="text-end ">
              <a href="newProduct.html"><button class="buttonHeader">Разместить объявление</button></a>
              <a href="profileInfo.html"><button class="buttonHeader">Профиль</button></a>
            </div>
          </div>
        </div>
    </header>
    <main class=" ">
        <div class="container main2">
            <div class="container px-4 py-5" id="custom-cards">
                <h2 id="productsAround" class="announcementAround">Запрос пользователя</h2>
                <div id="allProduct" class="row row-cols-1 row-cols-lg-5 align-items-stretch g-4 py-5">
                  <div class="col product" id="oneProduct">
                      <div class=" overflow-hidden productBorder">
                          <div class="d-flex flex-column p-3">
                              <img src="../image/noLogoItem900.png" alt="" class="">
                              <span>Название</span>
                              <p class="spanProduct">Цена</p>
                              <a href="product.html"><button class="buttonProduct"><span class="buttonProductText">Просмотр</span></button></a>
                          </div>
                      </div>
                  </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
