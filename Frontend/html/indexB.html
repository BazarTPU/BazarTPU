    <script>
      window.onload = () => {

        categories_list = ['Учеба','Техника','Электроника','Работа','Кухня','Спорт','Еда','Услуги','Мебель','Гардероб','Другое']

        function cloneCard(idParent, idCard, count) {
          let allProduct = document.getElementById(idParent);
          let oneProduct = document.getElementById(idCard);
          
          
          for(let i = 1; i < count; i++){
            let clone = oneProduct.cloneNode(true);
            clone.removeAttribute('id');
            allProduct.appendChild(clone);
          } 
          if(idParent=='idCategoryParent'){
            let p_list = document.getElementsByClassName('classP');
            let button_list = document.getElementsByClassName('classButton');
            // console.log(p_list)
            for(let i = 0; i < count; i++){
              
              p_list[i].innerHTML = categories_list[i];
              button_list[i].classList.add(i);
            } 
          }
        }
        cloneCard('idCategoryParent','idCategory',categories_list.length);
        cloneCard('allProduct','oneProduct',20);
      };


      function goThisCategory(object, nameButton) {
        let divCategories = document.getElementById('custom-cards');
        divCategories.style.display = 'none';
        let h2 = document.getElementById('productsAround');
        if(nameButton == 'product') {
          h2.innerHTML = categories_list[object.classList[1]];
        } else {
          h2.innerHTML = nameButton;
          let fotoMain = document.getElementById('fotoMain');
          fotoMain.style.display = 'none';
        }

        // h2.innerHTML = categories_list[object.classList[1]];
        // console.log(h2);
      }
