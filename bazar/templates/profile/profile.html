<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>
<body>
    <header class="text-bg-white">
        <div class="container headerMain">
          <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">

            <a href="" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none">
                <img src="{% static 'img/tpuLogo.png' %}" alt="LOGO" width="70px">
                <span class="mainName">Базар</span>
            </a>

            <form class="col-12 col-lg-3 mb-3 mb-lg-0 me-lg-3 inputMainLocation" role="search">
              <input type="search" class="inputMain" placeholder="Поиск">
            </form>

            <div class="text-end">
              <a href=""><button class="buttonHeader">Разместить объявление</button></a>
              <a href="{% url 'profile' %}"><button class="buttonHeader">Профиль</button></a>
            </div>
          </div>
        </div>
    </header>
    <main>
        <div class="container main2">
          <div class="row g-5">

            <div class="col-md-4 col-lg-3 sections">
              <a href="{% url 'profile' %}">
                <button class="w-100 mb-2 buttonSection btnAcctive" type="button">
                    Информация
                </button>
              </a>
              <a href="{% url 'profile_product' %}">
                <button class="w-100 mb-2 buttonSection btnNoAcctive" type="button">
                    Мои объявления
                </button>
              </a>
              <a href="{% url 'messages' %}">
                <button class="w-100 mb-2 buttonSection btnNoAcctive" type="button">
                  Сообщения
                </button>
              </a>
            </div>

            <div class="col-md-8 col-lg-9">
              <div>
                <img src="{{ user.profile_photo.url }}" class="img-thumbnail fotoProfile" alt="Profile Photo">
              </div>

              <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">Имя</label>
                <div class="col-sm-10">
                  <input type="text" class="areaInfo" readonly value="{{ user.first_name }}">
                </div>
              </div>
              <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">Фамилия</label>
                <div class="col-sm-10">
                  <input type="text" class="areaInfo" readonly value="{{ user.last_name }}">
                </div>
              </div>
              <div class="mb-3 row">
                <label class="col-sm-2 col-form-label">Email</label>
                <div class="col-sm-10">
                  <input type="text" class="areaInfo" readonly value="{{ user.email }}">
                </div>
              </div>
              <div class="mb-3 row">
                  <label class="col-sm-2 col-form-label">Телефон</label>
                  <div class="col-sm-10">
                    <input
                      type="text"
                      class="areaInfo"
                      name="phone"
                      id="phoneInput"
                      value="{{ user.phone }}"
                      readonly
                    >
                  </div>
                </div>
              <div class="mb-3 row">
                  <label class="col-sm-2 col-form-label">Telegram</label>
                  <div class="col-sm-10">
                    <input
                      type="text"
                      class="areaInfo"
                      name="telegram"
                      id="telegramInput"
                      value="{{ user.telegram }}"
                      readonly
                    >
                  </div>
                </div>
              <div class="mb-3 row">
                  <label class="col-sm-2 col-form-label">Общежитие</label>
                  <div class="col-sm-10">
                    <input
                      type="text"
                      class="areaInfo"
                      name="dormitory"
                      id="dormitoryInput"
                      value="{{ user.dormitory }}"
                      readonly
                    >
                  </div>
                </div>
              <button type="button" id="editButton" class="mb-2 buttonChange">
                  Изменить
                </button>

                <!-- Кнопка "Сохранить" (появляется только в режиме редактирования) -->
                <button type="submit" id="saveButton" class="mb-2 buttonChange" style="display: none;">
                  Сохранить
                </button>
              <p style="margin-top: 100%;"></p>
            </div>
          </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/profile_edit.js' %}"></script>
</body>
</html>
